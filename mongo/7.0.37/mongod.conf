# MongoDB 配置（Docker / K8s 挂载）
# 省平台上报日志专用实例，与业务 MySQL 分离

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 0.0.0.0

processManagement:
  fork: false

security:
  authorization: enabled
